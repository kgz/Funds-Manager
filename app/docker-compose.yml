# MySQL data: bind to a path on your external drive (not the SD card).
# Put MYSQL_DATA_DIR in .env next to this file, e.g. MYSQL_DATA_DIR=/mnt/media/funds-mysql
# Create the dir first; MySQL 8 image runs as uid 999: sudo mkdir -p "$MYSQL_DATA_DIR" && sudo chown 999:999 "$MYSQL_DATA_DIR"
# basic mysql docker compose
version: "3.8"
services:
    db:
        restart: unless-stopped
        image: mysql:8.0
        environment:
            #  use empty password
            MYSQL_ROOT_PASSWORD: ""
            MYSQL_ALLOW_EMPTY_PASSWORD: true

        ports:
            - "3308:3306"
        volumes:
            - ${MYSQL_DATA_DIR:-./mysql}:/var/lib/mysql
