# MySQL (legacy) + PostgreSQL (target).
# MYSQL_DATA_DIR / POSTGRES_DATA_DIR in .env — e.g. /mnt/media/funds-mysql
# MySQL uid 999: sudo mkdir -p "$MYSQL_DATA_DIR" && sudo chown 999:999 "$MYSQL_DATA_DIR"
version: "3.8"
services:
    db:
        restart: unless-stopped
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: ""
            MYSQL_ALLOW_EMPTY_PASSWORD: true
            MYSQL_DATABASE: funds
        ports:
            - "3308:3306"
        volumes:
            - ${MYSQL_DATA_DIR:-./mysql}:/var/lib/mysql

    postgres:
        restart: unless-stopped
        image: postgres:16
        environment:
            POSTGRES_USER: funds
            POSTGRES_PASSWORD: funds
            POSTGRES_DB: funds
        ports:
            - "5434:5432"
        volumes:
            - ${POSTGRES_DATA_DIR:-./postgres}:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U funds -d funds"]
            interval: 5s
            timeout: 5s
            retries: 5
