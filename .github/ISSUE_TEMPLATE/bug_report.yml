name: Bug report
description: Something is broken or incorrect
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Docker vs local dev, app version or git SHA if known
      placeholder: |
        e.g. WSL2, Chrome, local dev, main @ abc1234
    validations:
      required: false
