name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match tag to Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep '^version = ' app/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag v${tag_version} does not match app/Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi

  build-linux:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:embed

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p server_v2

      - name: Package linux x86_64
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="dist/funds-manager-${version}"
          mkdir -p "${pkg}/lib"
          cp target/release/server_v2 "${pkg}/"
          cp app/lib/libpdfium.so "${pkg}/lib/"
          printf '%s\n' \
            "Funds Manager ${version} (Linux x86_64)" \
            "" \
            "1. Set DATABASE_URL" \
            "2. Run ./server_v2" \
            "3. Open http://127.0.0.1:2020" \
            > "${pkg}/README.txt"
          tar -czf "dist/funds-manager-${version}-linux-x86_64.tar.gz" -C dist "funds-manager-${version}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/funds-manager-*-linux-x86_64.tar.gz

  github-release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
