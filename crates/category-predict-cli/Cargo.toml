[package]
name = "category-predict-cli"
version = "0.1.0"
edition = "2021"
description = "CLI to explore tktax-transaction CSV parsing and category prediction"

[[bin]]
name = "category-predict"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4.18", features = ["derive"] }
polars = { version = "0.46", default-features = false, features = [
    "parquet",
    "lazy",
    "json",
    "csv",
    "fmt",
    "dtype-slim",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
tktax-transaction = "0.2.2"
tktax-transaction-category = "0.2.2"

[patch.crates-io]
tktax-3p = { path = "../patches/tktax-3p" }

[workspace]
