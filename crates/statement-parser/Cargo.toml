[package]
name = "statement-parser"
version = "0.3.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
once_cell = "1.21.4"
pdfium-render = { version = "0.8.37", default-features = false, features = [
    "thread_safe",
    "image",
    "pdfium_7123",
] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
