# Pull-and-run: Funds Manager app (+ optional bundled Postgres)
#
# Default: app uses your existing dev Postgres on host port 5434
#   (start it: docker compose -f database/docker-compose.yml up -d postgres)
#
# Bundled Postgres instead:
#   docker compose --profile bundled-db up -d
services:
  postgres:
    profiles: ["bundled-db"]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: funds
      POSTGRES_PASSWORD: funds
      POSTGRES_DB: funds
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funds -d funds"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/kgz/funds-manager:latest
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_PORT:-2020}:2020"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://funds:funds@host.docker.internal:5434/funds?sslmode=disable}
      SERVER_PORT: "2020"
      PDFIUM_LIBRARY_PATH: /app/lib/libpdfium.so
      RUST_LOG: info

volumes:
  postgres_data:
