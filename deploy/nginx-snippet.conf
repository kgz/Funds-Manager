# Replace REPLACE_ME_FUNDS_MEDIA_ROOT with the parent directory of `media/`
# (same value as REMOTE_FUNDS_MEDIA_ROOT in deploy-to-pi.sh), e.g. /srv/funds

location /api/ {
    proxy_pass http://127.0.0.1:2020/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /media {
    return 302 /media/;
}

location /media/ {
    root REPLACE_ME_FUNDS_MEDIA_ROOT;
    try_files $uri $uri/ /media/index.html;
}
